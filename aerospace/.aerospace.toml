start-at-login = true
automatically-unhide-macos-hidden-apps = true
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 4
    inner.vertical =   4
    outer.left =       4
    outer.bottom =     4
    outer.top =        4
    outer.right =      4

# Floating rules
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[mode.main.binding]
    # Launch
    alt-enter = 'exec-and-forget open -na ghostty'
    alt-shift-s = 'exec-and-forget screencapture -i -c'
    alt-shift-r = 'exec-and-forget open -a Screenshot'

    # Layout
    alt-o = 'layout tiles horizontal vertical'

    # Focus
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    # Move window
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-ctrl-h = 'resize smart -50'
    alt-ctrl-j = 'resize smart -50'
    alt-ctrl-k = 'resize smart +50'
    alt-ctrl-l = 'resize smart +50'

    # Workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'
    alt-n = 'workspace n'

    # Move to workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'
    alt-shift-n = 'move-node-to-workspace n'

    # Misc
    alt-shift-enter = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-m = 'mode service'
    alt-shift-c = 'reload-config'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    enter = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    j = 'volume down'
    k = 'volume up'
    m = ['volume set 0', 'mode main']
